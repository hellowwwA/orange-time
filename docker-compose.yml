services:
  orange-time:
    build: .
    container_name: orange-time-app
    ports:
      - "3000:3000"   # Vite 前端
      - "3001:3001"   # Express 后端 API
    volumes:
      # 持久化任务数据（tasks.json）
      - /Users/lxn/docker/orange-time/tasks.json:/app/server/tasks.json
      # 持久化 markdown 文件
      - /Users/lxn/docker/orange-time/markdowns:/app/server/markdowns
      # 持久化上传的图片
      - /Users/lxn/docker/orange-time/images:/app/server/images
    env_file:
      - .env.local
    environment:
      - CHOKIDAR_USEPOLLING=true
      # 让容器内的 Vite 代理指向宿主机上的认证后端（8080）
      - VITE_AUTH_API_URL=http://host.docker.internal:8080
    # 让容器能解析 host.docker.internal（Linux 兼容，macOS Docker Desktop 自带支持）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
